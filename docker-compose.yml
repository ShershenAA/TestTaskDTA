services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practitioners
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practitioners"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
