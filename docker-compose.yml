services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practitioners
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practitioners"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # REST API + FHIR + Swagger + producer. При первом запуске создаёт схему и наполняет БД тестовыми данными.
  api:
    build: .
    image: practitioners-api:latest
    environment:
      AppMode: api
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=practitioners;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Consumer событий импорта (тот же образ, другой режим запуска).
  consumer:
    image: practitioners-api:latest
    environment:
      AppMode: consumer
      Consumer__Name: consumer-1
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=practitioners;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
